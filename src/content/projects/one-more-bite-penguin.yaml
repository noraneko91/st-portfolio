overview:
  - ja: "sosogames-studio の最初のワンタッチモバイルゲームです。画面のどこでも押している間はペンギン「モグ」が潜り、離すと浮かび、軽くタップすると羽ばたいて一気に上がります。"
    en: "The first one-touch mobile game from sosogames-studio. While you hold anywhere on the screen, the penguin Mogu dives; let go and it rises; a quick tap makes it flap upward."
    zh: "这是 sosogames-studio 的第一款单键手机游戏。按住屏幕任意位置时企鹅“Mogu”下潜，松开就上浮，轻点一下会拍动翅膀快速上升。"
    ko: "sosogames-studio의 첫 원터치 모바일 게임입니다. 화면 어디든 누르는 동안 펭귄 \"모구\"가 잠수하고, 떼면 떠오르며, 짧게 톡 치면 날갯짓으로 쭉 올라갑니다."
  - ja: "魚は食べただけでは点にならず、基地（海面・潜水艇）に戻って初めてスコアが確定します。酸素が 0 になるとお腹の魚を失ってゲームオーバー。スコアが上がると床が開き、海から地殻・マントル・核まで 50 のエリアを降りていきます。"
    en: "Fish only count once you bring them back to base (the surface or a submarine). If oxygen hits zero, you lose everything in your belly and the run ends. Raising your score opens the floor, leading down through 50 zones of ocean, crust, mantle, and core."
    zh: "吃下的鱼要回到基地（海面或潜水艇）才会计分。氧气归零就会失去肚子里的鱼并结束游戏。分数提高后地面会打开，从海洋一路穿过地壳、地幔、地核共 50 个区域。"
    ko: "물고기는 먹기만 해서는 점수가 되지 않고, 기지(수면·잠수정)로 돌아와야 확정됩니다. 산소가 0이 되면 배 속 물고기를 잃고 게임 오버. 점수가 오르면 바닥이 열리고 바다부터 지각·맨틀·핵까지 50개 구역을 내려갑니다."
  - ja: "図鑑 394 枠・10 段階のレア度、エリアごとの危険物と巨大な危険生物、外核・内核の環境イベントと自然災害、ショップの永久強化、遊び方の画面があります。グラフィック・BGM・効果音はコードで作っています（描画は GDScript、音は Python で合成）。"
    en: "It has a 394-slot collection with 10 rarity tiers, per-zone hazards and giant hazard creatures, environmental events and natural disasters deep in the Earth, permanent upgrades in a shop, and a how-to-play screen. In-game graphics, music, and sound effects are generated in code (drawing in GDScript, audio synthesized in Python)."
    zh: "包含 394 格图鉴与 10 级稀有度、各区域的危险物和巨大危险生物、外核与内核的环境事件和自然灾害、商店的永久强化以及玩法说明画面。游戏内的图像、背景音乐和音效都由代码生成（绘制用 GDScript，声音用 Python 合成）。"
    ko: "도감 394칸·10단계 등급, 구역별 위험물과 위험한 거대 생물, 외핵·내핵 환경 이벤트와 자연재해, 상점 영구 강화, 게임 방법 화면이 있습니다. 게임 속 그래픽·배경음악·효과음은 코드로 만들었습니다 (그림은 GDScript, 소리는 Python으로 합성)."
  - ja: "Google Play Console にアプリを登録し、Android App Bundle（AAB）でアップロードして、現在はクローズドテストを行っています（現行バージョン 0.1.1）。ストア掲載文・フィーチャーグラフィック・スクリーンショット・プライバシーポリシーも用意しました。"
    en: "The app is registered in Google Play Console and uploaded as an Android App Bundle (AAB), and it is now in closed testing (current version 0.1.1). I also prepared the store listing, feature graphic, screenshots, and privacy policy."
    zh: "已在 Google Play Console 注册应用，以 Android App Bundle（AAB）上传，目前正在进行封闭测试（当前版本 0.1.1）。还准备了商店介绍文字、宣传图、截图和隐私政策。"
    ko: "Google Play Console에 앱을 등록하고 Android App Bundle(AAB)로 올려, 지금은 비공개 테스트를 진행하고 있습니다 (현재 버전 0.1.1). 스토어 소개 글·피처 그래픽·스크린샷·개인정보 처리방침도 준비했습니다."
  - ja: "収益化は AdMob の広告（復活・氷 2 倍のリワード広告、2 回に 1 回の全面広告）を組み込みました。最初の公開は韓国語・ゲストログインのみとし、課金ショップ・ソーシャルログイン・ランキングは公開後のアップデートでつなぐ予定です（英語・日本語・中国語の翻訳は用意済みで、ネイティブチェック後に公開）。"
    en: "For monetization I integrated AdMob ads (rewarded ads for reviving and doubling ice, plus an interstitial every second run). The first release is Korean-only with guest login; the paid shop, social login, and rankings will be connected in later updates (English, Japanese, and Chinese translations are ready and will ship after native review)."
    zh: "变现方面接入了 AdMob 广告（复活和冰块翻倍的激励广告，以及每两局一次的插页广告）。首次发布只提供韩语和游客登录，付费商店、社交登录和排行榜将在发布后的更新中接入（英语、日语、中文翻译已准备好，母语审校后公开）。"
    ko: "수익화는 AdMob 광고(부활·얼음 2배 보상형 광고, 2판에 한 번 전면 광고)를 붙였습니다. 첫 출시는 한국어·게스트 로그인만 제공하고, 유료 상점·소셜 로그인·랭킹은 출시 후 업데이트로 연결할 예정입니다 (영어·일본어·중국어 번역은 준비해 두었고 원어민 검수 후 공개)."
phases: [requirements, basic-design, detailed-design, implementation, unit-test, integration-test]
stack:
  - name: "Godot Engine"
    version: "4.7.2"
    purpose:
      ja: "ゲームエンジン（Compatibility レンダラー、Android AAB・Web 書き出し）"
      en: "Game engine (Compatibility renderer, Android AAB and Web export)"
      zh: "游戏引擎（Compatibility 渲染器，导出 Android AAB 与 Web）"
      ko: "게임 엔진 (Compatibility 렌더러, Android AAB·웹 내보내기)"
  - name: "GDScript"
    purpose:
      ja: "移動・酸素・生成・UI・キャラクター描画などゲーム全体"
      en: "The whole game: movement, oxygen, spawning, UI, and character drawing"
      zh: "整个游戏：移动、氧气、生成、UI 和角色绘制"
      ko: "이동·산소·생성·UI·캐릭터 그리기 등 게임 전체"
  - name: "Python"
    purpose:
      ja: "バランスデータ生成・効果音と BGM の合成・翻訳表のチェック"
      en: "Balance data generation, music and sound synthesis, and translation checks"
      zh: "生成平衡数据、合成音效与背景音乐、检查翻译表"
      ko: "밸런스 데이터 생성·효과음과 음악 합성·번역표 검사"
  - name: "Google AdMob（Poing Godot プラグイン）"
    version: "5.1.0"
    purpose:
      ja: "リワード広告・全面広告"
      en: "Rewarded and interstitial ads"
      zh: "激励广告与插页广告"
      ko: "보상형 광고·전면 광고"
  - name: "Google Play Console"
    purpose:
      ja: "アプリ登録・クローズドテスト・ストア掲載情報"
      en: "App registration, closed testing, and store listing"
      zh: "应用注册、封闭测试与商店信息"
      ko: "앱 등록·비공개 테스트·스토어 등록정보"
  - name: "Firebase / Supabase"
    purpose:
      ja: "アカウントとクラウドバックアップの検証（公開版では未使用）"
      en: "Prototyping accounts and cloud backup (not used in the release build)"
      zh: "账号与云备份的验证（发布版本中未使用）"
      ko: "계정·클라우드 백업 검증 (출시 버전에서는 미사용)"
decisions:
  - topic:
      ja: "物理エンジンを使わず移動を自前で計算"
      en: "Calculating movement by hand instead of using the physics engine"
      zh: "不使用物理引擎，自行计算移动"
      ko: "물리 엔진 없이 이동을 직접 계산"
    reason:
      ja: "押す・離すだけの操作なので、加速度・抵抗・お腹の重さによる浮き上がりの鈍さを数値で細かく調整できるようにした"
      en: "With only press-and-release controls, I wanted to tune acceleration, drag, and how belly weight slows the rise precisely by numbers"
      zh: "操作只有按下和松开，因此希望能用数值精细调整加速度、阻力以及肚子重量对上浮的影响"
      ko: "누르기·떼기만 하는 조작이라 가속도·저항·배 무게에 따른 상승 둔화를 수치로 세밀하게 조정할 수 있게 했다"
    alternatives:
      ja: "RigidBody2D（物理エンジン）"
      en: "RigidBody2D (physics engine)"
      zh: "RigidBody2D（物理引擎）"
      ko: "RigidBody2D (물리 엔진)"
  - topic:
      ja: "バランス数値を設定ファイルに分離"
      en: "Keeping balance values in a config file"
      zh: "把平衡数值放到配置文件中"
      ko: "밸런스 수치를 설정 파일로 분리"
    reason:
      ja: "50 エリア・373 種のスコア・出現・重さを Python の生成スクリプトで一括計算し、コードを直さずに調整できるようにした"
      en: "Scores, spawn rates, and weights for 50 zones and 373 species are computed in bulk by a Python generator, so tuning needs no code changes"
      zh: "用 Python 生成脚本批量计算 50 个区域、373 种生物的分数、出现率和重量，调整时无需改代码"
      ko: "50개 구역·373종의 점수·출현·무게를 Python 생성 스크립트로 한꺼번에 계산해, 코드를 고치지 않고 조정할 수 있게 했다"
challenges:
  - problem:
      ja: "コードで描いた生き物は 1 匹あたりの描画が重く、数が増えるとフレームレートが落ちる"
      en: "Code-drawn creatures are expensive to draw, so frame rate dropped as their number grew"
      zh: "用代码绘制的生物每只绘制开销较大，数量一多帧率就下降"
      ko: "코드로 그린 생물은 한 마리당 그리기가 무거워, 수가 늘면 프레임이 떨어진다"
    solution:
      ja: "画面の近くにいるものだけ、毎秒の描き直し回数を制限して更新するようにした（移動・当たり判定は毎フレーム維持）"
      en: "Only creatures near the screen are redrawn, at a capped rate per second (movement and collision still run every frame)"
      zh: "只重绘屏幕附近的生物，并限制每秒重绘次数（移动和碰撞判定仍每帧进行）"
      ko: "화면 근처에 있는 것만, 초당 다시 그리는 횟수를 제한해 갱신하도록 했다 (이동·충돌 판정은 매 프레임 유지)"
  - problem:
      ja: "4 言語に対応すると、英語などの長い文言がボタンや画面からはみ出す"
      en: "Supporting four languages meant longer strings, such as English, overflowed buttons and screens"
      zh: "支持 4 种语言后，英语等较长的文字会超出按钮和画面"
      ko: "4개 언어를 지원하니 영어처럼 긴 문구가 버튼·화면 밖으로 넘친다"
    solution:
      ja: "ボタンは自動で折り返し、横に並ぶボタンは文字サイズをそろえて縮めるようにし、翻訳キーの漏れは Python スクリプトで検査した"
      en: "Buttons wrap automatically, side-by-side buttons shrink their font together, and a Python script checks for missing translation keys"
      zh: "按钮自动换行，并排的按钮统一缩小字号，并用 Python 脚本检查遗漏的翻译键"
      ko: "버튼은 자동 줄바꿈, 나란히 놓인 버튼은 글자 크기를 같이 줄이게 하고, 번역 키 누락은 Python 스크립트로 검사했다"
  - problem:
      ja: "広告 SDK の初期化が終わる前に広告を読み込むと、アプリが落ちてしまう"
      en: "Loading an ad before the ad SDK had finished initializing crashed the app"
      zh: "在广告 SDK 初始化完成前加载广告会导致应用崩溃"
      ko: "광고 SDK 초기화가 끝나기 전에 광고를 불러오면 앱이 꺼진다"
    solution:
      ja: "起動時に先に初期化し、完了の通知を受けてから広告を読み込むようにした。開発ビルドは常にテスト広告、開発者の端末もテスト端末に登録して、誤って本番広告を押さないようにした"
      en: "Initialize at startup and load ads only after the completion callback. Debug builds always use test ads, and the developer phone is registered as a test device so real ads are never clicked by mistake"
      zh: "启动时先初始化，收到完成通知后再加载广告。开发版本始终使用测试广告，并把开发者手机登记为测试设备，避免误点正式广告"
      ko: "시작할 때 미리 초기화하고, 완료 알림을 받은 뒤에 광고를 불러오도록 했다. 개발 빌드는 항상 테스트 광고, 개발자 폰도 테스트 기기로 등록해 실수로 실제 광고를 누르지 않게 했다"
