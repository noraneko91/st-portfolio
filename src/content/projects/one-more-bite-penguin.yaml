title:
  ja: "あと一口、ペンギン！（モバイルゲーム）"
  en: "One More Bite, Penguin! (mobile game)"
  zh: "再吃一口企鹅（手机游戏）"
  ko: "한 입만 더, 펭귄! (모바일 게임)"
summary:
  ja: "押している間だけ潜り、離すと浮かぶワンタッチのモバイルゲーム。食いしん坊のペンギンが海面から地球の中心（6,371km）まで 50 のエリアを降りていく。Godot 4 で開発し、Google Play でクローズドテスト中"
  en: "A one-touch mobile game where you dive while holding and rise when you let go. A hungry penguin eats its way down 50 zones, from the sea surface to the center of the Earth (6,371 km). Built with Godot 4 and now in closed testing on Google Play"
  zh: "按住就下潜、松开就上浮的单键手机游戏。贪吃的企鹅从海面穿过 50 个区域潜到地心（6,371 公里）。使用 Godot 4 开发，目前正在 Google Play 封闭测试中"
  ko: "누르는 동안 잠수하고 떼면 떠오르는 원터치 모바일 게임. 먹보 펭귄이 바다 표층부터 지구 중심(6,371km)까지 50개 구역을 내려간다. Godot 4로 개발해 Google Play 비공개 테스트 진행 중"
category: build
