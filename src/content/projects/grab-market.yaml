# 出典: コミット履歴とコード。ノマドコーダーの YouTube 講座に沿って作った (本人の説明。リポジトリの説明には「인프런」とある) / 출처: 커밋 이력과 코드. 노마드 코더의 YouTube 강좌를 따라 만들었다 (본인 설명. 리포지토리 설명에는 "인프런"이라고 되어 있다)
# TODO: 講座の内容に自分で追加した部分があれば summary に加える（要確認） / 강의 내용에 직접 추가한 부분이 있으면 summary에 넣는다 (확인 필요)
title:
  ja: グラブマーケット（中古取引マーケット）
  en: Grab Market (second-hand marketplace)
  zh: Grab Market（二手交易市场）
  ko: 그랩마켓 (중고 거래 마켓)
summary:
  ja: ノマドコーダー（Nomad Coders）の YouTube 講座に沿って React と Express で作った中古取引マーケットの Web アプリ。商品一覧・商品登録（画像アップロード）・バナー・購入処理を実装
  en: A second-hand marketplace web app built with React and Express while following a Nomad Coders YouTube course, with product listing, product upload with images, banners, and purchase handling
  zh: 跟随 Nomad Coders 的 YouTube 课程使用 React 和 Express 制作的二手交易市场网页应用，实现了商品列表、商品发布（图片上传）、横幅和购买处理
  ko: 노마드 코더(Nomad Coders)의 YouTube 강좌를 따라 React와 Express로 만든 중고 거래 마켓 웹 앱. 상품 목록·상품 등록(이미지 업로드)·배너·구매 처리 구현
category: learning
status: completed
start: "2023-05"
end: "2023-05"
# 実際にかかった期間の目安 / 실제로 걸린 기간의 기준
duration:
  ja: "約1週間"
  en: "about a week"
  zh: "约 1 周"
  ko: "약 1주일"
tech: [react, javascript, express, sqlite, docker]

# 詳細の出典: 2 つのリポジトリの package.json・ソースコード・Dockerfile・fly.toml・コミット履歴 / 상세 출처: 두 리포지토리의 package.json·소스 코드·Dockerfile·fly.toml·커밋 이력
overview:
  - ja: "ノマドコーダー（Nomad Coders）の YouTube 講座に沿って、学習用に作った中古取引マーケットです。画面（React）と API サーバー（Express）を別々のリポジトリで作りました。"
    en: "A second-hand marketplace built for practice while following a Nomad Coders YouTube course. The frontend (React) and the API server (Express) live in separate repositories."
    zh: "这是跟随 Nomad Coders 的 YouTube 课程、为学习而制作的二手交易市场。前端（React）和 API 服务器（Express）分别放在不同的仓库中。"
    ko: "노마드 코더(Nomad Coders)의 YouTube 강좌를 따라 공부용으로 만든 중고 거래 마켓입니다. 화면(React)과 API 서버(Express)를 각각 다른 리포지토리로 만들었습니다."
  - ja: "画面: 商品一覧（登録からの経過時間を dayjs で表示）、商品詳細と購入、商品登録（antd の Form・Upload で画像を送信）、スライドするバナー（antd の Carousel）。"
    en: "Frontend: product list (time since posting shown with dayjs), product detail and purchase, product upload (images sent via antd Form and Upload), and a sliding banner (antd Carousel)."
    zh: "前端：商品列表（用 dayjs 显示发布后经过的时间）、商品详情与购买、商品发布（通过 antd 的 Form 和 Upload 上传图片）、轮播横幅（antd 的 Carousel）。"
    ko: "화면: 상품 목록 (등록 후 경과 시간을 dayjs로 표시), 상품 상세와 구매, 상품 등록 (antd의 Form·Upload로 이미지 전송), 슬라이드 배너 (antd의 Carousel)."
  - ja: "サーバー: 商品の一覧・詳細・登録・購入とバナー取得の API、multer による画像の保存、Sequelize + SQLite によるデータの保存。"
    en: "Server: APIs for listing, viewing, creating, and purchasing products and for fetching banners; image storage with multer; data storage with Sequelize and SQLite."
    zh: "服务器：商品列表、详情、发布、购买以及获取横幅的 API，用 multer 保存图片，用 Sequelize + SQLite 保存数据。"
    ko: "서버: 상품 목록·상세·등록·구매와 배너 조회 API, multer로 이미지 저장, Sequelize + SQLite로 데이터 저장."
  - ja: "サーバーを Docker イメージにして Fly.io（東京リージョン）へデプロイする設定を追加しました。"
    en: "I added configuration to package the server as a Docker image and deploy it to Fly.io (Tokyo region)."
    zh: "添加了把服务器打包成 Docker 镜像并部署到 Fly.io（东京区域）的配置。"
    ko: "서버를 Docker 이미지로 만들어 Fly.io(도쿄 리전)에 배포하는 설정을 추가했습니다."
