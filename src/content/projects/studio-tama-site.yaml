overview:
  - ja: "友人が空間デザインの会社を立ち上げたものの、まだホームページがなかったため、代わりに制作しました。"
    en: "A friend started a spatial design company that had no website yet, so I built one for them."
    zh: "朋友创办了一家空间设计公司，但还没有网站，于是我为他们制作了这个网站。"
    ko: "친구가 공간 디자인 회사를 차렸는데 아직 홈페이지가 없어서, 대신 만들어 주었습니다."
  - ja: "ソウルの空間デザインスタジオ「STUDIO TAMA」のウェブサイトです。トップ・About・Services・Projects・Contact のページで構成しています。"
    en: "A website for STUDIO TAMA, a spatial design studio in Seoul, with Home, About, Services, Projects, and Contact pages."
    zh: "这是首尔空间设计工作室“STUDIO TAMA”的网站，由首页、About、Services、Projects、Contact 页面组成。"
    ko: "서울의 공간 디자인 스튜디오 \"STUDIO TAMA\"의 웹사이트입니다. 메인·About·Services·Projects·Contact 페이지로 구성했습니다."
  - ja: "Projects はカテゴリ（Retail / F&B）と年で絞り込めます。プロジェクトの詳細では写真を絵はがきの束のように重ねて表示し、マウスホイール・スワイプ・キーボードで 1 枚ずつめくれます。"
    en: "Projects can be filtered by category (Retail / F&B) and year. On each project page, photos are stacked like a pile of postcards and can be flipped one at a time with the mouse wheel, swipes, or the keyboard."
    zh: "Projects 可以按类别（Retail / F&B）和年份筛选。项目详情页把照片像一叠明信片一样叠放，可用鼠标滚轮、滑动或键盘一张张翻看。"
    ko: "Projects는 카테고리(Retail / F&B)와 연도로 거를 수 있습니다. 프로젝트 상세에서는 사진을 엽서 더미처럼 겹쳐 보여주고, 마우스 휠·스와이프·키보드로 한 장씩 넘길 수 있습니다."
  - ja: "初めて訪れたときだけイントロのアニメーションを流します（動きを減らす設定では省略）。お問い合わせフォームは、入力内容を入れたメールアプリを開く方式です。"
    en: "An intro animation plays only on the first visit (skipped when reduced motion is on). The contact form opens the mail app with the entered details filled in."
    zh: "只在首次访问时播放开场动画（开启减少动态效果时省略）。联系表单会打开已填好内容的邮件应用。"
    ko: "처음 방문했을 때만 인트로 애니메이션을 보여줍니다 (동작 줄이기 설정에서는 생략). 문의 폼은 입력한 내용을 채운 메일 앱을 여는 방식입니다."
  - ja: "Next.js の静的書き出しで HTML を作り、main ブランチへの push で GitHub Actions が GitHub Pages にデプロイします。"
    en: "Next.js static export generates the HTML, and GitHub Actions deploys it to GitHub Pages on every push to main."
    zh: "用 Next.js 的静态导出生成 HTML，推送到 main 分支时由 GitHub Actions 部署到 GitHub Pages。"
    ko: "Next.js의 정적 export로 HTML을 만들고, main 브랜치에 push하면 GitHub Actions가 GitHub Pages에 배포합니다."
