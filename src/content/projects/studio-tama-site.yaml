challenges:
  - problem:
      ja: "GitHub Pages ではサイトが /studio-tama-site/ の下に置かれるため、画像のパスがずれる"
      en: "On GitHub Pages the site lives under /studio-tama-site/, so image paths broke"
      zh: "在 GitHub Pages 上网站位于 /studio-tama-site/ 之下，导致图片路径出错"
      ko: "GitHub Pages에서는 사이트가 /studio-tama-site/ 아래에 놓여 이미지 경로가 어긋난다"
    solution:
      ja: "デプロイ時だけ basePath を設定し、画像のパスに前置きを付ける関数（asset）を通すようにした"
      en: "Set basePath only for deployment and route image paths through a helper (asset) that adds the prefix"
      zh: "只在部署时设置 basePath，并让图片路径经过一个添加前缀的函数（asset）"
      ko: "배포할 때만 basePath를 설정하고, 이미지 경로에 앞부분을 붙이는 함수(asset)를 거치게 했다"
  - problem:
      ja: "サーバーのない GitHub Pages では、カテゴリ・年の絞り込みをサーバーで処理できない"
      en: "GitHub Pages has no server, so filtering by category and year cannot run server-side"
      zh: "GitHub Pages 没有服务器，无法在服务器端处理按类别和年份的筛选"
      ko: "서버가 없는 GitHub Pages에서는 카테고리·연도 필터를 서버에서 처리할 수 없다"
    solution:
      ja: "URL のクエリ（?category= ・?year=）をブラウザで読み、一覧をその場で絞り込むようにした"
      en: "Read the URL query (?category=, ?year=) in the browser and filter the list there"
      zh: "在浏览器中读取 URL 查询参数（?category=、?year=），当场筛选列表"
      ko: "URL 쿼리(?category=·?year=)를 브라우저에서 읽어 목록을 바로 거르도록 했다"
  - problem:
      ja: "トラックパッドでは細かいスクロールが続けて届き、写真が一気に何枚もめくれてしまう"
      en: "Trackpads send many small scroll events, flipping through several photos at once"
      zh: "触控板会连续发送细小的滚动，导致照片一下子翻过好几张"
      ko: "트랙패드에서는 잘게 나뉜 스크롤이 연달아 들어와 사진이 한꺼번에 여러 장 넘어간다"
    solution:
      ja: "ホイールの移動量を貯めて、一定量に達したときに 1 枚だけめくるようにした"
      en: "Accumulate the wheel delta and flip exactly one photo once it reaches a threshold"
      zh: "累计滚轮的移动量，达到一定量时只翻一张"
      ko: "휠 이동량을 모아서 일정량에 도달했을 때 한 장만 넘기도록 했다"
