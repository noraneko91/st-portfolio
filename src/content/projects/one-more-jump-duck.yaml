title:
  ja: "もう一段、アヒル！（モバイル 3D ゲーム）"
  en: "One More Jump, Duck! (3D mobile game)"
  zh: "小鸭，再跳一步！（3D 手机游戏）"
  ko: "한 칸만 더, 오리! (3D 모바일 게임)"
summary:
  ja: "長押しでためて離すとジャンプする、縦画面 3D のワンタッチ無限上昇ゲーム。子アヒルが足場から足場へ跳び、街から宇宙の果てまで昇っていく。Godot 4 で開発し、Google Play の内部テストまで進行中"
  en: "A portrait 3D one-touch endless climber: hold to charge, release to jump. A duckling hops from platform to platform, from the city all the way into outer space. Built with Godot 4 and now in internal testing on Google Play"
  zh: "长按蓄力、松开跳跃的竖屏 3D 单键无限上升游戏。小鸭在平台之间跳跃，从城市一路升到宇宙尽头。使用 Godot 4 开发，目前进行到 Google Play 内部测试"
  ko: "꾹 눌러 모으고 떼면 점프하는 세로 화면 3D 원터치 무한 상승 게임. 아기 오리가 발판에서 발판으로 뛰어 도시에서 우주 끝까지 올라간다. Godot 4로 개발해 Google Play 내부 테스트 진행 중"
category: build
status: in-progress
