overview:
  - ja: "sosogames-studio の 2 作目のモバイルゲームです。最初の作品「あと一口、ペンギン！」の経験をもとに、今度は 3D で作っています。長押しで力をため、離すと子アヒルが次の足場へ跳びます。着地に失敗して落ちたら終わりです。"
    en: "The second mobile game from sosogames-studio, built in 3D this time on the experience of the first one, One More Bite, Penguin!. Hold to build power and release to send the duckling to the next platform; miss a landing and the run ends."
    zh: "这是 sosogames-studio 的第二款手机游戏。基于第一款作品《再吃一口企鹅》的经验，这次用 3D 制作。长按蓄力，松开后小鸭跳向下一个平台，落地失败掉下去就结束。"
    ko: "sosogames-studio의 두 번째 모바일 게임입니다. 첫 작품 「한 입만 더, 펭귄!」의 경험을 바탕으로 이번에는 3D로 만들고 있습니다. 꾹 눌러 힘을 모으고 떼면 아기 오리가 다음 발판으로 뛰고, 착지에 실패해 떨어지면 끝납니다."
  - ja: "足場は 360 度どの方向にもランダムに現れ、カメラが向きに合わせて回り込みます。街の屋上から大気圏・月・惑星・銀河まで 68 のエリアを昇り、50,000m ごとにブラックホールを通って次の宇宙へ続きます。"
    en: "Platforms appear at random in any direction around 360 degrees, and the camera turns to follow. You climb through 68 regions, from city rooftops through the atmosphere, the Moon, planets, and galaxies, and every 50,000 m a black hole leads into the next universe."
    zh: "平台会在 360 度任意方向随机出现，镜头随之转向。从城市屋顶经过大气层、月球、行星、银河共 68 个区域，每 50,000 米穿过黑洞进入下一个宇宙。"
    ko: "발판은 360도 어느 방향으로든 무작위로 나타나고, 카메라가 방향에 맞춰 돌아갑니다. 도시 옥상부터 대기권·달·행성·은하까지 68개 구역을 올라가며, 50,000m마다 블랙홀을 지나 다음 우주로 이어집니다."
  - ja: "PERFECT 着地でコインを集め、見た目だけが変わるスキンを買えます（お金で能力を買えない設計）。12 言語に対応し、ゲスト・Google・Apple のアカウント、端末間の保存データ同期も用意しています。"
    en: "Perfect landings earn coins for cosmetic-only skins (no pay-to-win). It supports 12 languages, and includes guest, Google, and Apple accounts with save sync across devices."
    zh: "完美落地可获得金币，用于购买仅改变外观的皮肤（无法花钱买能力）。支持 12 种语言，并提供游客、Google、Apple 账号以及跨设备存档同步。"
    ko: "PERFECT 착지로 코인을 모아 외형만 바뀌는 스킨을 살 수 있습니다 (돈으로 능력을 살 수 없는 설계). 12개 언어를 지원하고, 게스트·Google·Apple 계정과 기기 간 저장 데이터 동기화도 준비했습니다."
  - ja: "ランキングとコイン報酬の不正を防ぐため、Firebase（Authentication・Firestore・Cloud Functions・App Check）と Cloud Run のサーバーで、送られてきた入力からプレイをもう一度再現して検証する仕組みを作りました。Google Play Console で内部テストを始めており、広告・課金と公式ランキングの有効化はこれからです。"
    en: "To keep rankings and coin rewards fair, I built server-side verification with Firebase (Authentication, Firestore, Cloud Functions, App Check) and Cloud Run that replays each run from the submitted inputs. Internal testing has started on Google Play Console; ads, purchases, and the official ranking are not switched on yet."
    zh: "为了防止排行榜和金币奖励作弊，我用 Firebase（Authentication、Firestore、Cloud Functions、App Check）和 Cloud Run 搭建了服务器端验证，根据提交的输入重新再现一局游戏。已在 Google Play Console 开始内部测试，广告、内购和正式排行榜尚未启用。"
    ko: "랭킹과 코인 보상의 부정을 막기 위해, Firebase(Authentication·Firestore·Cloud Functions·App Check)와 Cloud Run 서버에서 보내온 입력으로 한 판을 다시 재현해 검증하는 구조를 만들었습니다. Google Play Console에서 내부 테스트를 시작했고, 광고·결제와 공식 랭킹 활성화는 앞으로 할 일입니다."
phases: [requirements, basic-design, detailed-design, implementation, unit-test, integration-test]
stack:
  - name: "Godot Engine"
    version: "4.7.2"
    purpose:
      ja: "ゲームエンジン（3D・Compatibility レンダラー、Android AAB 書き出し）"
      en: "Game engine (3D, Compatibility renderer, Android AAB export)"
      zh: "游戏引擎（3D、Compatibility 渲染器，导出 Android AAB）"
      ko: "게임 엔진 (3D·Compatibility 렌더러, Android AAB 내보내기)"
  - name: "GDScript"
    purpose:
      ja: "ジャンプ計算・足場生成・カメラ・UI などゲーム全体"
      en: "The whole game: jump physics, platform generation, camera, and UI"
      zh: "整个游戏：跳跃计算、平台生成、镜头和 UI"
      ko: "점프 계산·발판 생성·카메라·UI 등 게임 전체"
  - name: "Firebase"
    purpose:
      ja: "Authentication・Firestore・Cloud Functions・App Check（アカウント・保存・ランキング・報酬）"
      en: "Authentication, Firestore, Cloud Functions, and App Check (accounts, saves, rankings, rewards)"
      zh: "Authentication、Firestore、Cloud Functions、App Check（账号、存档、排行榜、奖励）"
      ko: "Authentication·Firestore·Cloud Functions·App Check (계정·저장·랭킹·보상)"
  - name: "Node.js"
    version: "22"
    purpose:
      ja: "Cloud Functions のサーバー処理とテスト"
      en: "Cloud Functions server logic and tests"
      zh: "Cloud Functions 的服务器处理与测试"
      ko: "Cloud Functions 서버 처리와 테스트"
  - name: "Cloud Run / Docker"
    purpose:
      ja: "プレイを再現して検証する非公開サーバー（Godot をヘッドレスで実行）"
      en: "Private verifier that replays runs (Godot running headless)"
      zh: "重新再现游戏进行验证的私有服务器（无头运行 Godot）"
      ko: "한 판을 재현해 검증하는 비공개 서버 (Godot를 화면 없이 실행)"
  - name: "Python"
    purpose:
      ja: "リリース AAB のビルド・検査、効果音生成、翻訳表のチェック"
      en: "Building and auditing release AABs, generating sound effects, and checking translations"
      zh: "构建与检查发布 AAB、生成音效、检查翻译表"
      ko: "출시용 AAB 빌드·검사, 효과음 생성, 번역표 검사"
  - name: "Google Play Console"
    purpose:
      ja: "アプリ登録・内部テスト"
      en: "App registration and internal testing"
      zh: "应用注册与内部测试"
      ko: "앱 등록·내부 테스트"
decisions:
  - topic:
      ja: "ジャンプの軌道を 1 か所で計算"
      en: "Computing the jump trajectory in one place"
      zh: "只在一处计算跳跃轨迹"
      ko: "점프 궤적을 한 곳에서 계산"
    reason:
      ja: "足場の生成も同じ計算式を使うことで、「届かない足場」が出ないようにした"
      en: "Platform generation uses the same formula, so an unreachable platform can never appear"
      zh: "平台生成也使用同一个公式，避免出现“够不到的平台”"
      ko: "발판 생성도 같은 공식을 써서 \"닿을 수 없는 발판\"이 나오지 않게 했다"
  - topic:
      ja: "報酬・ランキングをサーバーでプレイ再現して検証"
      en: "Verifying rewards and rankings by replaying runs on the server"
      zh: "在服务器上重新再现游戏来验证奖励和排行榜"
      ko: "보상·랭킹을 서버에서 한 판 재현으로 검증"
    reason:
      ja: "端末から届いた結果をそのまま信じると改ざんできるため、入力とシードからゲームと同じ Godot のコードで再計算し、同じ結果になったときだけ記録・付与するようにした。応答が失われて同じ内容が再送されても二重に付与しない"
      en: "Trusting results sent from devices would allow tampering, so the server recomputes each run from its inputs and seed with the same Godot code as the game, and only records or rewards it when the results match. Resubmissions after a lost response are not paid twice"
      zh: "直接信任设备发来的结果可能被篡改，因此根据输入和种子用与游戏相同的 Godot 代码重新计算，只有结果一致时才记录或发放。即使响应丢失后重复提交也不会重复发放"
      ko: "기기에서 온 결과를 그대로 믿으면 조작될 수 있어서, 입력과 시드로 게임과 같은 Godot 코드로 다시 계산해 결과가 같을 때만 기록·지급하도록 했다. 응답이 유실돼 같은 내용이 다시 와도 두 번 지급하지 않는다"
    alternatives:
      ja: "端末の結果をそのまま保存"
      en: "Storing results reported by the device as-is"
      zh: "直接保存设备上报的结果"
      ko: "기기가 보낸 결과를 그대로 저장"
challenges:
  - problem:
      ja: "3D でランダムに足場を置くと、跳ぶ方向によっては手前の足場で次の着地点が隠れてしまう"
      en: "With random 3D platforms, the next landing spot could be hidden behind nearer platforms depending on the direction"
      zh: "在 3D 中随机放置平台时，根据跳跃方向，下一个落点可能被前面的平台挡住"
      ko: "3D로 발판을 무작위로 놓으면 뛰는 방향에 따라 앞쪽 발판에 다음 착지 지점이 가려진다"
    solution:
      ja: "視線をさえぎる足場だけを半透明にし、着地点の輪郭と目印は見えるままにした（位置と当たり判定はそのまま）"
      en: "Only platforms blocking the line of sight fade out, while the landing outline and marker stay visible (positions and collisions unchanged)"
      zh: "只让挡住视线的平台变成半透明，落点轮廓和标记保持可见（位置和碰撞不变）"
      ko: "시야를 가리는 발판만 반투명하게 하고, 착지 지점의 윤곽과 표시는 그대로 보이게 했다 (위치·충돌 판정은 유지)"
  - problem:
      ja: "高く昇るほど座標の数値が大きくなり、3D の位置計算の精度が落ちる"
      en: "The higher you climb, the larger the coordinates get, and 3D position precision degrades"
      zh: "升得越高坐标数值越大，3D 位置计算精度会下降"
      ko: "높이 올라갈수록 좌표 숫자가 커져 3D 위치 계산의 정밀도가 떨어진다"
    solution:
      ja: "一定距離ごとに世界の原点をアヒルの近くへずらし（フローティングオリジン）、画面に出す高度は別の値として管理した"
      en: "Shift the world origin near the duck at intervals (floating origin) and keep the displayed altitude as a separate value"
      zh: "每隔一段距离把世界原点移到小鸭附近（浮动原点），并把显示的高度作为单独的数值管理"
      ko: "일정 거리마다 세계의 원점을 오리 근처로 옮기고 (플로팅 오리진), 화면에 보여 주는 고도는 별도 값으로 관리했다"
  - problem:
      ja: "機能を足すたびに、以前の動きが壊れていないか確かめるのが大変になる"
      en: "As features piled up, checking that nothing earlier had broken became hard"
      zh: "每次添加功能，都越来越难确认之前的行为没有被破坏"
      ko: "기능을 더할 때마다 예전 동작이 깨지지 않았는지 확인하기가 어려워진다"
    solution:
      ja: "自動テストと、タッチ操作で何百回も着地し続けるプレイボットを用意し、変更のたびに実行するようにした（現在 4 万件以上のチェック）"
      en: "Built automated tests and a touch-driven play bot that lands hundreds of times in a row, and run them on every change (over 40,000 checks today)"
      zh: "准备了自动测试和用触摸操作连续落地数百次的游戏机器人，每次修改都运行（目前超过 4 万项检查）"
      ko: "자동 테스트와 터치 조작으로 수백 번 연속 착지하는 플레이 봇을 만들어 변경할 때마다 돌리도록 했다 (현재 4만 건 이상 검사)"
