title:
  ja: "もう一段、アヒル！（モバイル 3D ゲーム）"
  en: "One More Jump, Duck! (3D mobile game)"
  zh: "小鸭，再跳一步！（3D 手机游戏）"
  ko: "한 칸만 더, 오리! (3D 모바일 게임)"
summary:
  ja: "長押しでためて離すとジャンプする、縦画面 3D のワンタッチ上昇ゲーム。子アヒルが雲の足場を跳び、地上から宇宙の果てまで昇っていく。Godot 4 で開発し、2026 年 11 月に Google Play で 175 か国に公開"
  en: "A portrait 3D one-touch climbing game: hold to charge, release to jump. A duckling hops across cloud platforms from the ground to the edge of the universe. Built with Godot 4 and released on Google Play in 175 countries in November 2026"
  zh: "长按蓄力、松开跳跃的竖屏 3D 单键上升游戏。小鸭在云朵平台间跳跃，从地面一路升到宇宙尽头。使用 Godot 4 开发，2026 年 11 月在 Google Play 面向 175 个国家和地区上线"
  ko: "꾹 눌러 모으고 떼면 점프하는 세로 화면 3D 원터치 상승 게임. 아기 오리가 구름 발판을 뛰어 지상에서 우주 끝까지 올라간다. Godot 4로 개발해 2026년 11월 Google Play에 175개국 출시"
