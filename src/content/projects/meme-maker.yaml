# 出典: リポジトリのコード (index.html・app.js)。ノマドコーダーの YouTube 講座に沿って作った (本人の説明) / 출처: 리포지토리 코드 (index.html·app.js). 노마드 코더의 YouTube 강좌를 따라 만들었다 (본인 설명)
title:
  ja: Meme Maker（お絵描きアプリ）
  en: Meme Maker (drawing app)
  zh: Meme Maker（绘图应用）
  ko: Meme Maker (그림 그리기 앱)
summary:
  ja: ノマドコーダー（Nomad Coders）の YouTube 講座に沿って作った、Canvas API のお絵描きアプリ。線の描画・塗りつぶし・消しゴム・画像の読み込み・文字の追加・保存ができる
  en: A Canvas API drawing app built while following a Nomad Coders YouTube course, with drawing, fill, eraser, image loading, text, and save
  zh: 跟随 Nomad Coders 的 YouTube 课程制作的 Canvas API 绘图应用，支持画线、填充、橡皮擦、加载图片、添加文字和保存
  ko: 노마드 코더(Nomad Coders)의 YouTube 강좌를 따라 만든 Canvas API 그림 그리기 앱. 선 그리기·채우기·지우개·이미지 불러오기·글자 넣기·저장을 할 수 있다
