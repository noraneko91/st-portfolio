  en: st-portfolio (this site)
  zh: st-portfolio（本网站）
  ko: st-portfolio (이 사이트)
summary:
  ja: Astro + TypeScriptで構築した、4言語対応の静的ポートフォリオサイト
  en: A static portfolio site in four languages, built with Astro and TypeScript
  zh: 使用Astro + TypeScript构建、支持四种语言的静态作品集网站
  ko: Astro + TypeScript로 구축한 4개 언어 지원 정적 포트폴리오 사이트
