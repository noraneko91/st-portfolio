    - ja: 今後はバックエンドとクラウドを軸に、設計・構築の領域を広げていきます。
      en: Going forward, I plan to expand my work in design and infrastructure, centered on backend and cloud.
      zh: 今后将以后端和云为核心，继续拓展设计与构建领域的工作。
      ko: 앞으로는 백엔드와 클라우드를 축으로 설계·구축 영역을 넓혀 갈 계획입니다.
