  headline:
    ja: これまで培ってきたバックエンド・クラウド領域の経験を強みに、フロントエンドにも挑戦し、システム全体を見渡せるフルスタックエンジニアを目指しています。
    en: Building on my experience in backend and cloud, I am taking on frontend development as well, aiming to become a full-stack engineer who can see the whole system.
    zh: 以积累至今的后端与云领域经验为优势，我也在挑战前端开发，目标是成为能够通观整个系统的全栈工程师。
    ko: 지금까지 쌓아 온 백엔드·클라우드 분야의 경험을 강점으로 프런트엔드에도 도전하며, 시스템 전체를 볼 수 있는 풀스택 엔지니어를 목표로 하고 있습니다.
