<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OGP 画像の原本。全ページ・全言語で共通のため、文字はラテン文字だけにする / OGP 이미지 원본. 모든 페이지·언어 공통이라 글자는 라틴 문자만 쓴다 -->
  <!-- ドメインを変えたら URL の行を直して generate.mjs で再生成する / 도메인을 바꾸면 URL 줄을 고치고 generate.mjs로 다시 생성한다 -->
  <rect width="1200" height="630" fill="#fafaf7" />
  <rect x="80" y="80" width="64" height="8" fill="#3346c2" />
  <text x="80" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#5f5e58">KIM SUNGTAE — Portfolio</text>
  <text x="80" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#1c1c1a">Backend Engineer</text>
  <text x="80" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#1c1c1a">Java / Python / AWS</text>
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#deddd6" stroke-width="2" />
  <text x="80" y="560" font-family="Consolas, Menlo, monospace" font-size="28" fill="#5f5e58">st-portfolio.st-kim.workers.dev</text>
  <text x="1120" y="560" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="28" fill="#5f5e58">JA / EN / ZH / KO</text>
</svg>
