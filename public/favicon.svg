<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 誌面の罫線をモチーフにしたアイコン。色はサイトの配色に合わせ、ダークモードでも見えるようにする / 지면 괘선을 모티프로 한 아이콘. 색은 사이트 색 구성에 맞추고 다크모드에서도 보이게 한다 -->
  <style>
    .bg { fill: #fafaf7; stroke: #1c1c1a; stroke-opacity: 0.15; }
    .fg { fill: #1c1c1a; }
    .accent { fill: #3346c2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #131312; stroke: #e8e6e1; }
      .fg { fill: #e8e6e1; }
      .accent { fill: #9aa6ff; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="31" height="31" rx="4" />
  <rect class="accent" x="6" y="8" width="20" height="4" />
  <rect class="fg" x="6" y="15" width="20" height="3" />
  <rect class="fg" x="6" y="21" width="13" height="3" />
</svg>
